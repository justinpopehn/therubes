name: Weekly Fantasy Stats Sync

on:
  schedule:
    - cron: '0 13 * * 2' # Runs every Tuesday at 1:00 PM UTC (8:00 AM CST)
  workflow_dispatch: # Allows you to trigger it manually anytime you want

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install espn-api

      - name: Run build script
        run: |
          python3 build_site.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add leaderboard.html
          git commit -m "Auto-update leaderboard via GitHub Actions" || exit 0
          git push
